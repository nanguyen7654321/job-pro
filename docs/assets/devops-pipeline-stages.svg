<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Job Platform DevOps Pipeline Stages</title>
  <desc id="desc">A visual summary of GitHub Actions and Jenkins pipeline stages for the AI Job Platform.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">DevOps Pipeline: What Runs On Every Change</text>
  <text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">GitHub Actions runs these checks as parallel jobs. Jenkins can run the same checks as sequential stages on a self-hosted agent.</text>

  <rect x="60" y="140" width="220" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="86" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Triggers</text>
  <text x="86" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e40af">push, pull request,</text>
  <text x="86" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e40af">manual workflow run</text>

  <line x1="280" y1="186" x2="346" y2="186" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="360" y="130" width="260" height="120" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="386" y="166" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#14532d">Frontend Job</text>
  <text x="386" y="193" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">Node 22, npm install</text>
  <text x="386" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">Prettier check</text>
  <text x="386" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">TypeScript + Next.js build</text>

  <rect x="660" y="130" width="260" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="686" y="166" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7c2d12">Backend Job</text>
  <text x="686" y="193" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9a3412">Java 25 Temurin</text>
  <text x="686" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9a3412">Maven dependency cache</text>
  <text x="686" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9a3412">mvn verify backend modules</text>

  <rect x="960" y="130" width="260" height="120" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="986" y="166" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#581c87">Compose Job</text>
  <text x="986" y="193" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b21a8">docker compose config</text>
  <text x="986" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b21a8">validates YAML, ports,</text>
  <text x="986" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b21a8">volumes, environment shape</text>

  <line x1="620" y1="190" x2="646" y2="190" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="190" x2="946" y2="190" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="130" y="330" width="1020" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="374" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Jenkins Pipeline View</text>
  <text x="170" y="405" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Same checks, usually run sequentially on a machine you own or administer.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <rect x="170" y="445" width="140" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="196" y="486" fill="#075985">Install deps</text>
    <rect x="340" y="445" width="140" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="371" y="486" fill="#14532d">Format</text>
    <rect x="510" y="445" width="140" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="539" y="486" fill="#713f12">Typecheck</text>
    <rect x="680" y="445" width="140" height="70" rx="10" fill="#ffedd5" stroke="#ea580c"/>
    <text x="726" y="486" fill="#7c2d12">Build</text>
    <rect x="850" y="445" width="140" height="70" rx="10" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="878" y="486" fill="#581c87">Maven verify</text>
    <rect x="1020" y="445" width="90" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="1044" y="476" fill="#7f1d1d">Compose</text>
    <text x="1054" y="496" fill="#7f1d1d">config</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="310" y1="480" x2="330" y2="480"/>
    <line x1="480" y1="480" x2="500" y2="480"/>
    <line x1="650" y1="480" x2="670" y2="480"/>
    <line x1="820" y1="480" x2="840" y2="480"/>
    <line x1="990" y1="480" x2="1010" y2="480"/>
  </g>

  <rect x="60" y="640" width="1160" height="58" rx="12" fill="#0f172a"/>
  <text x="88" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e2e8f0">Current scope: validation only. Future additions can include tests, security scans, Docker image publish, and deployment.</text>
</svg>
