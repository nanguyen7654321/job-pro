<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Example Grafana Dashboard For AI Job Platform</title>
  <desc id="desc">A mock Grafana dashboard showing backend target status, service availability, JVM heap usage, and HTTP request rate.</desc>
  <rect width="1280" height="760" fill="#111827"/>
  <rect x="0" y="0" width="1280" height="64" fill="#030712"/>
  <text x="32" y="41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">AI Job Platform Overview</text>
  <text x="1010" y="41" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">Last 30m | Refresh 15s</text>

  <rect x="32" y="92" width="350" height="210" rx="10" fill="#1f2937" stroke="#374151"/>
  <text x="56" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f9fafb">Backend Targets Up</text>
  <text x="56" y="223" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#22c55e">8</text>
  <text x="178" y="223" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bbf7d0">services reachable</text>
  <text x="56" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9ca3af">PromQL: sum(up{job=~backend-services})</text>

  <rect x="414" y="92" width="834" height="210" rx="10" fill="#1f2937" stroke="#374151"/>
  <text x="438" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f9fafb">Service Availability</text>
  <line x1="450" y1="254" x2="1210" y2="254" stroke="#4b5563"/>
  <line x1="450" y1="170" x2="1210" y2="170" stroke="#374151" stroke-dasharray="4 6"/>
  <polyline points="450,170 560,170 670,170 780,170 890,170 1000,170 1110,170 1210,170" fill="none" stroke="#22c55e" stroke-width="4"/>
  <polyline points="450,196 560,196 670,196 780,196 890,196 1000,196 1110,196 1210,196" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <polyline points="450,222 560,222 670,222 780,222 890,222 1000,222 1110,222 1210,222" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="438" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9ca3af">Each line should stay at 1. A drop to 0 means Prometheus cannot reach that service.</text>

  <rect x="32" y="334" width="596" height="360" rx="10" fill="#1f2937" stroke="#374151"/>
  <text x="56" y="369" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f9fafb">JVM Heap Used</text>
  <line x1="74" y1="642" x2="586" y2="642" stroke="#4b5563"/>
  <line x1="74" y1="410" x2="74" y2="642" stroke="#4b5563"/>
  <polygon points="74,610 150,585 226,596 302,555 378,565 454,530 530,540 586,505 586,642 74,642" fill="#2563eb" opacity="0.35"/>
  <polyline points="74,610 150,585 226,596 302,555 378,565 454,530 530,540 586,505" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <text x="56" y="672" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9ca3af">Shows heap memory per Spring Boot service.</text>

  <rect x="660" y="334" width="588" height="360" rx="10" fill="#1f2937" stroke="#374151"/>
  <text x="684" y="369" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f9fafb">HTTP Request Rate</text>
  <line x1="702" y1="642" x2="1206" y2="642" stroke="#4b5563"/>
  <line x1="702" y1="410" x2="702" y2="642" stroke="#4b5563"/>
  <polyline points="702,620 774,610 846,560 918,590 990,500 1062,530 1134,460 1206,490" fill="none" stroke="#f97316" stroke-width="5"/>
  <circle cx="846" cy="560" r="5" fill="#fdba74"/>
  <circle cx="990" cy="500" r="5" fill="#fdba74"/>
  <circle cx="1134" cy="460" r="5" fill="#fdba74"/>
  <text x="684" y="672" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9ca3af">Increases when users call API endpoints through the web apps or curl.</text>
</svg>
