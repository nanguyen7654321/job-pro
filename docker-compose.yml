version: "3.9"

services:
  # Primary relational database plus pgvector for MVP semantic search.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-jobs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aijobs}
      POSTGRES_USER: ${POSTGRES_USER:-aijobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aijobs}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aijobs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Short-lived cache and future rate-limit / background coordination store.
  redis:
    image: redis:7
    container_name: ai-jobs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local S3-compatible object storage for uploaded resumes.
  minio:
    image: minio/minio
    container_name: ai-jobs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Prometheus scrapes local Spring Boot Actuator metrics and stores time-series
  # data for Grafana dashboards.
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: ai-jobs-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana is provisioned from files so the local dashboard and Prometheus data
  # source are repeatable for every developer.
  grafana:
    image: grafana/grafana-oss:12.0.0
    container_name: ai-jobs-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
